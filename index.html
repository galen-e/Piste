<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piste – Ski & Snowboard Run Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#10222e;--mu:#5d7280;--bd:#d8e3ea;--sig:#ff5a1f;--pine:#0f5c4d;--ice:#cfe6f3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1820;--card:#13262f;--ink:#e8f1f6;--mu:#8fa7b5;--bd:#23404d;--ice:#1d3a48;--pine:#3fc2a5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1820;--card:#13262f;--ink:#e8f1f6;--mu:#8fa7b5;--bd:#23404d;--ice:#1d3a48;--pine:#3fc2a5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 Barlow,system-ui,sans-serif;max-width:560px;margin:0 auto;padding:0 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
h1{font:700 26px 'Barlow Condensed',Impact,sans-serif;margin:0;letter-spacing:.5px}
h2{font:700 20px 'Barlow Condensed',Impact,sans-serif;margin:22px 0 8px}
button{font:600 15px Barlow,system-ui,sans-serif;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--ice);color:var(--ink)}
button:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.pri{background:var(--sig);color:#fff;width:100%;font-size:18px;padding:16px}
.stop{background:var(--ink);color:var(--bg);width:100%;font-size:18px;padding:16px}
.sm{padding:6px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.hero{text-align:center;padding:22px 14px}
.big{font:700 96px/1 'Barlow Condensed',Impact,sans-serif;color:var(--sig)}
.unit{color:var(--mu);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.st b{display:block;font:700 26px/1.1 'Barlow Condensed',Impact,sans-serif}
.st span{color:var(--mu);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-weight:500;color:var(--ink)}
.row.sel{border-color:var(--sig);box-shadow:0 0 0 2px var(--sig) inset}
.mu{color:var(--mu);font-size:13px}
.map{width:100%;height:auto;background:var(--ice);border-radius:14px;display:block}
.err{color:var(--sig);margin:10px 0}
.legend{height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(210,85%,50%),hsl(105,85%,50%),hsl(0,85%,50%));margin:8px 0 2px}
.leg{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.leaflet-container{font:500 13px Barlow,system-ui,sans-serif}.mapbox{border-radius:14px;overflow:hidden;background:var(--ice);isolation:isolate}</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f5c4d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Piste"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<header><h1>Piste</h1><button class="sm" id="ub" aria-label="Switch units"></button></header>
<main id="app"></main>
<script>
var unit="kmh",sessions=[],rec=null,watch=null,tick=null,view="home",cur=null,sel=-1,err="",wl=null;
try{unit=localStorage.getItem("piste_u")||"kmh";sessions=JSON.parse(localStorage.getItem("piste_s")||"[]")}catch(e){}
function save(){try{localStorage.setItem("piste_s",JSON.stringify(sessions))}catch(e){err="Couldn’t save to this browser’s storage."}}
var K=function(){return unit==="kmh"?3.6:2.23694},UN=function(){return unit==="kmh"?"km/h":"mph"};
var sp=function(v){return(v*K()).toFixed(1)};
var dist=function(m){return unit==="kmh"?(m>=1000?(m/1000).toFixed(2)+" km":Math.round(m)+" m"):(m/1609.34).toFixed(2)+" mi"};
var vert=function(m){return unit==="kmh"?Math.round(m)+" m":Math.round(m*3.281)+" ft"};
function tm(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(r).padStart(2,"0")}
function hav(a,b){var R=6371000,p=Math.PI/180,dl=(b.lat-a.lat)*p,dn=(b.lon-a.lon)*p,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}

/* Turn raw GPS points into runs: sustained downhill movement, lifts and rests are excluded. */
function analyze(P){
  var n=P.length,d=[0],al=[],i,j;
  for(i=1;i<n;i++)d[i]=d[i-1]+hav(P[i-1],P[i]);
  for(i=0;i<n;i++){var s=0,c=0;for(j=Math.max(0,i-2);j<=Math.min(n-1,i+2);j++){s+=P[j].alt;c++}al[i]=s/c}
  var down=[],w=5;
  for(i=0;i<n;i++){if(i<w){down[i]=false;continue}
    var dt=(P[i].t-P[i-w].t)/1000||1;down[i]=(al[i]-al[i-w])/dt<-0.4&&P[i].spd>1.5}
  var segs=[],a=-1,last=-1;
  for(i=0;i<n;i++){if(down[i]){if(a<0)a=i;last=i}
    else if(a>=0&&(P[i].t-P[last].t)/1000>12){segs.push([a,last]);a=-1}}
  if(a>=0)segs.push([a,last]);
  var runs=[];
  segs.forEach(function(g){var A=g[0],B=g[1],t=(P[B].t-P[A].t)/1000,v=al[A]-al[B];
    if(t<20||v<15)return;
    var top=0;for(var k=A;k<=B;k++)top=Math.max(top,P[k].spd);
    var ds=d[B]-d[A];runs.push({a:A,b:B,time:t,dist:ds,top:top,avg:ds/t,vert:v})});
  return{runs:runs,d:d,al:al}
}
function totals(S){var R=S.an.runs,t={n:R.length,time:0,dist:0,top:0,vert:0};
  R.forEach(function(r){t.time+=r.time;t.dist+=r.dist;t.vert+=r.vert;t.top=Math.max(t.top,r.top)});
  if(!R.length&&S.pts.length>1){var P=S.pts,n=P.length;t.all=true;t.dist=S.an.d[n-1]||0;t.time=(P[n-1].t-P[0].t)/1000;
    P.forEach(function(p){t.top=Math.max(t.top,p.spd)});t.vert=Math.max.apply(0,S.an.al)-Math.min.apply(0,S.an.al);t.avg=t.time?t.dist/t.time:0}
  else t.avg=t.time?t.dist/t.time:0;return t}
function mk(name,pts){var S={id:Date.now(),name:name,date:Date.now(),pts:pts};S.an=analyze(pts);return S}

/* Recording */
function startRec(){
  err="";
  if(!window.isSecureContext){err="GPS needs a secure (https) page. Host this file on https and open that link on your phone.";draw();return}
  if(!navigator.geolocation){err="This device doesn’t offer location access. Try the demo day.";draw();return}
  rec={pts:[],t0:Date.now(),dist:0};
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}
  watch=navigator.geolocation.watchPosition(function(p){
    var c=p.coords;rec.acc=Math.round(c.accuracy);if(c.accuracy>35)return;
    var pt={t:p.timestamp,lat:c.latitude,lon:c.longitude,alt:c.altitude==null?0:c.altitude,spd:0},L=rec.pts[rec.pts.length-1];
    if(L){var dd=hav(L,pt),dt=(pt.t-L.t)/1000;if(dt<=0)return;
      if(dd/dt>40)return;
      var sv=c.speed!=null&&c.speed>=0?c.speed:dd/dt;
      if(dd<Math.max(5,c.accuracy*.7)&&sv<1.5){rec.cs=0;rec.msg=null;return}
      rec.dist+=dd;pt.spd=sv}
    rec.cs=pt.spd;rec.pts.push(pt);rec.top=Math.max(rec.top||0,pt.spd);rec.msg=null
  },function(e){if(e.code===1){err="Location is blocked. Allow location for this site in your browser settings, then start again.";stopRec(true)}else if(rec)rec.msg=e.code===2?"No GPS signal. Move to open sky.":"Still searching for GPS…"},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  tick=setInterval(live,1000);draw()
}
function stopRec(abort){
  if(watch!=null)navigator.geolocation.clearWatch(watch);clearInterval(tick);watch=null;tick=null;
  try{wl&&wl.release()}catch(e){}
  var r=rec;rec=null;
  if(!abort&&r&&r.pts.length>=2){var S=mk("Ski day "+new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"}),r.pts);sessions.unshift(S2(S));save();open(0);return}
  if(!abort)err="Not enough GPS data to build a session. Ride a little longer and stop again.";
  draw()
}
function S2(S){var o={id:S.id,name:S.name,date:S.date,pts:S.pts};o.an=S.an;return o}
function live(){
  if(!rec)return;var L=rec.pts[rec.pts.length-1];
  var e=document.getElementById("live");if(!e)return;
  liveMap();e.innerHTML='<div class="big">'+sp(rec.cs||0)+'</div><div class="unit">'+UN()+' now</div>'+
  '<div class="grid" style="margin-top:16px"><div class="st"><b>'+tm((Date.now()-rec.t0)/1000)+'</b><span>Elapsed</span></div>'+
  '<div class="st"><b>'+dist(rec.dist)+'</b><span>Distance</span></div>'+
  '<div class="st"><b>'+sp(rec.top||0)+'</b><span>Top '+UN()+'</span></div></div>'+
  '<p class="mu">'+(L?(rec.pts.length+" points · altitude "+vert(L.alt)+" · "):(rec.msg||"Waiting for a precise fix")+" · ")+(rec.acc!=null?"accuracy ±"+rec.acc+" m":"")+'</p>'
}

/* Demo day: three laps on a synthetic mountain */
function demo(){
  var pts=[],t=Date.parse("2026-02-14T09:30:00"),la0=46.05,lo0=7.25,cs=Math.cos(la0*Math.PI/180);
  function add(x,y,z,v){pts.push({t:t,lat:la0+y/111320,lon:lo0+x/(111320*cs),alt:z+(Math.random()-.5)*1.2,spd:Math.max(0,v)});t+=1000}
  for(var lap=0;lap<4;lap++){
    var off=lap*70-100,ph=lap*0.9,k=3+lap%3,amp=60+lap*18,s;
    for(s=0;s<=1;s+=1/200)add(off+(300+off*.2)*s+Math.sin(s*7+lap)*6,1300*s,1800+300*s,3.4+Math.random()*.4);
    for(var q=0;q<18;q++)add(off+300+off*.2,1300,2100,0);
    s=0;var v=3;
    while(s<1){
      var sv=7+12*Math.sin(Math.PI*Math.min(1,s*1.1))*(0.8+0.2*Math.sin(s*20+ph))+(Math.random()-.5)*2;
      v+=(sv-v)*.35;
      var x=off+(300+off*.2)*(1-s)+Math.sin(s*Math.PI*k+ph)*amp*Math.sin(Math.PI*s)*1.0;
      add(x,1300*(1-s),2100-300*s,v);
      s+=v/1750;
    }
    for(var r=0;r<25;r++)add(off,0,1800,0);
  }
  var S=mk("Demo day · Alpine bowl",pts);sessions.unshift(S2(S));save();open(0)
}

/* Views */
function open(i){cur=sessions[i];sel=-1;view="detail";draw();window.scrollTo(0,0)}
function pick(i){sel=sel===i?-1:i;draw()}
function back(){view="home";cur=null;draw()}
function del(){if(confirm("Delete this session?")){sessions=sessions.filter(function(s){return s!==cur});save();back()}}
function setU(){unit=unit==="kmh"?"mph":"kmh";try{localStorage.setItem("piste_u",unit)}catch(e){}draw()}

function mapSVG(S){
  var P=S.pts,R=S.an.runs,W=360,H=300,pad=18,i,la0=P[0].lat,cs=Math.cos(la0*Math.PI/180);
  var xs=P.map(function(p){return(p.lon-P[0].lon)*cs}),ys=P.map(function(p){return-(p.lat-la0)});
  var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys);
  var sc=Math.min((W-2*pad)/((x1-x0)||1e-6),(H-2*pad)/((y1-y0)||1e-6)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
  var X=function(i){return(ox+(xs[i]-x0)*sc).toFixed(1)},Y=function(i){return(oy+(ys[i]-y0)*sc).toFixed(1)};
  var top=Math.max(1,S.an.runs.reduce(function(m,r){return Math.max(m,r.top)},0));
  var o='<svg class="map" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Route map">';
  var all="";for(i=0;i<P.length;i++)all+=X(i)+","+Y(i)+" ";
  o+='<polyline points="'+all+'" fill="none" stroke="#8fa7b5" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/>';
  R.forEach(function(r,ri){var dim=sel>=0&&sel!==ri;
    o+='<g opacity="'+(dim?.25:1)+'" stroke-linecap="round">';
    for(i=r.a+1;i<=r.b;i++){var t=Math.min(1,P[i].spd/top);
      o+='<line x1="'+X(i-1)+'" y1="'+Y(i-1)+'" x2="'+X(i)+'" y2="'+Y(i)+'" stroke="hsl('+Math.round(210-210*t)+',85%,50%)" stroke-width="'+(sel===ri?5:3.5)+'"/>'}
    o+='<circle cx="'+X(r.a)+'" cy="'+Y(r.a)+'" r="5" fill="#fff" stroke="#10222e" stroke-width="2"/>';
    o+='<text x="'+(+X(r.a)+8)+'" y="'+(+Y(r.a)+4)+'" font-size="11" font-weight="700" fill="#10222e">'+(ri+1)+'</text></g>'});
  return o+'</svg>'
}
function profile(S){
  var P=S.pts,al=S.an.al,W=360,H=90,mn=Math.min.apply(0,al),mx=Math.max.apply(0,al),n=P.length,t0=P[0].t,T=P[n-1].t-t0||1;
  var X=function(i){return((P[i].t-t0)/T*W).toFixed(1)},Y=function(i){return(H-6-(al[i]-mn)/((mx-mn)||1)*(H-12)).toFixed(1)};
  var o='<svg class="map" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Elevation profile" style="background:var(--card);border:1px solid var(--bd)">';
  S.an.runs.forEach(function(r,i){o+='<rect x="'+X(r.a)+'" y="0" width="'+(X(r.b)-X(r.a))+'" height="'+H+'" fill="'+(sel===i?"#ff5a1f":"#ff5a1f")+'" opacity="'+(sel===i?.35:.14)+'"/>'});
  var pl="";for(var i=0;i<n;i+=Math.max(1,Math.floor(n/300)))pl+=X(i)+","+Y(i)+" ";
  return o+'<polyline points="'+pl+'" fill="none" stroke="#0f5c4d" stroke-width="2"/></svg><div class="leg"><span>'+vert(mn)+'</span><span>Elevation · orange = runs</span><span>'+vert(mx)+'</span></div>'
}
function st(v,l){return'<div class="st"><b>'+v+'</b><span>'+l+'</span></div>'}

function draw(){
  document.getElementById("ub").textContent=UN();
  var h="",a=document.getElementById("app");
  if(view==="detail"&&cur){
    var S=cur,T=totals(S),R=S.an.runs,x=sel>=0?R[sel]:null;
    h+='<button class="sm" onclick="back()">‹ Sessions</button><h2 style="margin-top:12px">'+S.name+'</h2><div class="mu">'+new Date(S.date).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})+'</div>';
    h+='<div class="grid" style="margin:12px 0">'+
      st(sp(x?x.top:T.top),(x?"Run "+(sel+1)+" top ":"Top ")+UN())+st(sp(x?x.avg:T.avg),"Avg "+UN())+st(tm(x?x.time:T.time),"Run time")+
      st(dist(x?x.dist:T.dist),"Distance")+st(vert(x?x.vert:T.vert),"Vertical")+st(x?"Run "+(sel+1):T.n,x?"Selected":"Runs")+'</div>';
    h+='<div id="lmap" class="mapbox" style="height:340px"></div><div class="legend"></div><div class="leg"><span>slow</span><span>fast</span></div><h2>Elevation</h2>'+profile(S)+'<h2>Runs</h2>';
    if(!R.length)h+='<p class="mu">No downhill runs detected. Runs need at least 20 seconds and 15 m of descent. The stats above cover all movement instead.</p>';
    R.forEach(function(r,i){h+='<button class="row'+(sel===i?" sel":"")+'" onclick="pick('+i+')"><span><b>Run '+(i+1)+'</b><br><span class="mu">'+tm(r.time)+' · '+dist(r.dist)+' · '+vert(r.vert)+' down</span></span><span style="text-align:right"><b>'+sp(r.top)+'</b> <span class="mu">'+UN()+' top</span><br><span class="mu">'+sp(r.avg)+' avg</span></span></button>'});
    h+='<div class="two"><button onclick="back()">Close</button><button onclick="del()">Delete session</button></div>'
  }else{
    if(rec){h+='<div class="card hero"><div id="live"></div></div><div id="lmap" class="mapbox" style="height:260px;margin-top:12px"></div><div style="margin-top:12px"><button class="stop" onclick="stopRec()">Finish and save</button></div>'}
    else{h+='<div class="card hero"><div class="big" style="font-size:56px;color:var(--ink)">Ready to ride</div><p class="mu">Keep the screen on and the phone in a chest pocket. Piste logs GPS speed and altitude, then splits your day into runs.</p></div>'+
      '<div class="two" style="grid-template-columns:2fr 1fr"><button class="pri" onclick="startRec()">Start tracking</button><button onclick="demo()" style="font-size:15px">Demo day</button></div>'}
    if(err)h+='<p class="err">'+err+'</p>';
    h+='<h2>Your sessions</h2>';
    if(!sessions.length)h+='<p class="mu">Nothing here yet. Start tracking on the hill, or load a demo day to see the route map.</p>';
    sessions.forEach(function(S,i){var T=totals(S);h+='<button class="row" onclick="open('+i+')"><span><b>'+S.name+'</b><br><span class="mu">'+T.n+' runs · '+dist(T.dist)+' · '+vert(T.vert)+' down</span></span><span style="text-align:right"><b>'+sp(T.top)+'</b><br><span class="mu">'+UN()+' top</span></span></button>'})
  }
  a.innerHTML=h;initMap();if(rec)live()
}
document.getElementById("ub").onclick=setU;draw();

/* Satellite map (Leaflet + Esri World Imagery) */
var lm=null,lline=null,lmark=null,lfirst=true;
function initMap(){
  if(lm){lm.remove();lm=null}lline=null;
  var el=document.getElementById("lmap");if(!el)return;
  if(typeof L==="undefined"){if(cur){el.style.height="auto";el.innerHTML=mapSVG(cur)}return}
  lm=L.map(el);
  var sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Imagery © Esri, Maxar, Earthstar Geographics"}),
  topo=L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{maxZoom:17,subdomains:"abc",attribution:"© OpenTopoMap, © OpenStreetMap contributors"});
  sat.addTo(lm);L.control.layers({"Satellite":sat,"Terrain":topo},null,{collapsed:true}).addTo(lm);
  if(rec){lfirst=true;lm.setView([46,7],3);return}
  var P=cur.pts,R=cur.an.runs,top=Math.max(1,Math.max.apply(0,R.map(function(r){return r.top}))),
  ll=P.map(function(p){return[p.lat,p.lon]});
  L.polyline(ll,{color:"#fff",weight:2,dashArray:"4 6",opacity:.8}).addTo(lm);
  R.forEach(function(r,ri){var dim=sel>=0&&sel!==ri;
    for(var i=r.a+1;i<=r.b;i++){var t=Math.min(1,P[i].spd/top);
      L.polyline([ll[i-1],ll[i]],{color:"hsl("+Math.round(210-210*t)+",90%,55%)",weight:sel===ri?6:4,opacity:dim?.3:1,lineCap:"round"}).addTo(lm)}
    L.circleMarker(ll[r.a],{radius:7,color:"#10222e",weight:2,fillColor:"#fff",fillOpacity:1}).bindTooltip(""+(ri+1),{permanent:true,direction:"right",offset:[6,0]}).addTo(lm)});
  lm.fitBounds(L.latLngBounds(sel>=0?ll.slice(R[sel].a,R[sel].b+1):ll),{padding:[24,24]})
}
function liveMap(){
  if(!lm||!rec||!rec.pts.length)return;
  var ll=rec.pts.map(function(p){return[p.lat,p.lon]}),last=ll[ll.length-1];
  if(!lline){lline=L.polyline([],{color:"#ff5a1f",weight:4}).addTo(lm);lmark=L.circleMarker(last,{radius:8,color:"#fff",weight:3,fillColor:"#ff5a1f",fillOpacity:1}).addTo(lm)}
  lline.setLatLngs(ll);lmark.setLatLng(last);
  if(lfirst){lm.setView(last,16);lfirst=false}else lm.panTo(last)
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script></body></html>
